 <!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4 Elements Vaal To World</title>
<style>
body{background:#0a0a0a;color:white;font-family:sans-serif;text-align:center;margin:0;padding:10px}
h1{margin:10px 0 0;font-size:28px;background:linear-gradient(90deg,#ff6a00,#ee0979,#00f2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#00ff88;letter-spacing:3px;font-size:12px;margin:5px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:15px auto}
.cell{aspect-ratio:1;background:#1a1a1a;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px;border:2px solid #333;cursor:pointer}
.cell.selected{border-color:yellow;box-shadow:0 0 12px yellow;transform:scale(0.95)}
.cell.matched{opacity:0;pointer-events:none}
.fire{border-color:#ff4400}.water{border-color:#00aaff}.air{border-color:#fff}.earth{border-color:#44ff44}
.btn{border:none;padding:12px 24px;border-radius:25px;color:white;font-weight:bold;margin:5px;font-size:14px}
.hint{background:linear-gradient(90deg,#ff6a00,#ff006a)}.reset{background:linear-gradient(90deg,#ff6a00,#ff2a00)}
.ad{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:99}
.adBox{background:#111;border:2px solid #ffcc00;border-radius:20px;padding:20px;max-width:300px}
</style>
</head>
<body>
<h1>4 ELEMENTS OF EARTH</h1>
<div class="sub">VAAL TO WORLD 🌍 MADE IN VAAL</div>
<div>Stage: <span id="stage">1</span>/1000 Time: <span id="time">30</span>s Games: <span id="games">0</span></div>
<div style="background:#222;border-radius:20px;padding:8px 16px;display:inline-block;margin:5px">Match: 3 same elements! | <span id="score">S1</span></div>
<div class="grid" id="grid"></div>
<button class="btn hint" onclick="showHint()">Hint (Ad)</button>
<button class="btn reset" onclick="init()">Reset</button><div class="ad" id="adModal"><div class="adBox">
<h2 style="color:#ffcc00">🔥 VAAL AD 🌍</h2>
<p>Thanks for 2 games! Ad supports VAAL dev</p>
<div style="background:#222;padding:30px;margin:10px 0;border-radius:10px">[AdMob Ad Here]</div>
<p style="color:#44ff44">You earn R5!</p>
<button class="btn reset" style="width:100%" onclick="closeAd()">Continue ❌</button>
</div></div>
<script>
let elements=['🔥','💧','🌍','💨'],classes=['fire','water','earth','air'];
let selected=[],cells=[],timer,time=30,stage=1,games=0,matchedCount=0;
function init(){clearInterval(timer);time=30;matchedCount=0;selected=[];document.getElementById('stage').textContent=stage;document.getElementById('games').textContent=games;build();startTimer();}
function build(){const grid=document.getElementById('grid');grid.innerHTML='';cells=[];let pool=[];for(let i=0;i<4;i++)for(let j=0;j<4;j++)pool.push(j%4);pool.sort(()=>Math.random()-0.5);pool.forEach((type)=>{let div=document.createElement('div');div.className='cell '+classes[type];div.textContent=elements[type];div.dataset.type=type;div.onclick=()=>select(div);grid.appendChild(div);cells.push(div);});}
function select(div){if(div.classList.contains('matched'))return;if(selected.includes(div)){div.classList.remove('selected');selected=selected.filter(d=>d!==div);return;}if(selected.length>=3)return;selected.push(div);div.classList.add('selected');if(selected.length===3)check();}
function check(){const t0=selected[0].dataset.type;const allSame=selected.every(d=>d.dataset.type===t0);if(allSame){setTimeout(()=>{selected.forEach(d=>{d.classList.remove('selected');d.classList.add('matched');});matchedCount+=3;selected=[];if(matchedCount>=16){stage=Math.min(1000,stage+1);games++;localStorage.setItem('vaalStage',stage);localStorage.setItem('vaalGames',games);if(games%2===0)showAd();else init();}},300);}else{setTimeout(()=>{selected.forEach(d=>d.classList.remove('selected'));selected=[];},500);}}
function startTimer(){document.getElementById('time').textContent=time;timer=setInterval(()=>{time--;document.getElementById('time').textContent=time;if(time<=0){clearInterval(timer);games++;localStorage.setItem('vaalGames',games);if(games%2===0)showAd();else{alert('Time up! Game '+games);init();}}},1000);}
function showAd(){if(games%2===0&&games>0)document.getElementById('adModal').style.display='flex';}
function closeAd(){document.getElementById('adModal').style.display='none';init();}
function showHint(){let unm=cells.filter(c=>!c.classList.contains('matched'));for(let type=0;type<4;type++){let same=unm.filter(c=>c.dataset.type==type);if(same.length>=3){same.slice(0,3).forEach(c=>{c.style.boxShadow='0 0 15px #00ff88';setTimeout(()=>c.style.boxShadow='',1000)});return;}}alert('No triple left - Reset!');}
stage=parseInt(localStorage.getItem('vaalStage')||'1');games=parseInt(localStorage.getItem('vaalGames')||'0');init();
</script></body></html>
