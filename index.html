<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4 Elements Battle</title>
<style>
body{background:#111;color:white;font-family:Arial;text-align:center;padding:20px}
button{padding:15px 25px;margin:10px;font-size:18px;border-radius:10px;border:none;cursor:pointer}
.fire{background:#ff4444} .water{background:#4444ff;color:white} .earth{background:#44ff44} .air{background:#ffff44}
#donate{background:#ffcc00;color:black;font-weight:bold;display:block;margin:20px auto;padding:15px 30px;text-decoration:none;border-radius:10px}
</style>
</head>
<body>
<h1>🔥💧🌍💨 4 ELEMENTS BATTLE</h1>
<h2 id="score">You: 0 | Chappies: 0</h2>
<h2 id="result">Choose your element!</h2>
<button class="fire" onclick="play('fire')">🔥 FIRE</button>
<button class="water" onclick="play('water')">💧 WATER</button>
<button class="earth" onclick="play('earth')">🌍 EARTH</button>
<button class="air" onclick="play('air')">💨 AIR</button>

<a id="donate" href="https://paypal.me/KMphuthi" target="_blank">💛 Donate via PayPal - Support Kananelo 💛</a>
<p>Built by Kananelo in Sebokeng - Vereeniging, Gauteng</p>

<script>
let you=0,chappies=0;
function play(p){
let e=['fire','water','earth','air'];
let c=e[Math.floor(Math.random()*4)];
let r='';
if(p===c) r=`Draw! Both chose ${p}`;
else if((p==='fire'&&c==='earth')||(p==='water'&&c==='fire')||(p==='earth'&&c==='air')||(p==='air'&&c==='water')){r=`You WIN! ${p} beats ${c}`;you++}
else{r=`You LOSE! ${c} beats ${p}`;chappies++}
document.getElementById('result').innerText=r+` (Chappies chose ${c})`;
document.getElementById('score').innerText=`You: ${you} | Chappies: ${chappies}`;
}
</script>
</body>
</html>
