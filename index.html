<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>4 Elements Vaal To World</title><style>body{background:#0a0a0a;color:#fff;font-family:sans-serif;text-align:center;margin:0;padding:10px}h1{margin:10px 0 0;font-size:28px;background:linear-gradient(90deg,#ff6a00,#ee0979,#00f2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.sub{color:#00ff88;letter-spacing:3px;font-size:12px;margin:5px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:15px auto}.cell{aspect-ratio:1;background:#1a1a1a;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px;border:2px solid #333}.cell.selected{border-color:yellow!important;box-shadow:0 0 12px yellow;transform:scale(.92)}.cell.matched{opacity:0;pointer-events:none}.fire{border-color:#ff4400}.water{border-color:#00aaff}.air{border-color:#fff}.earth{border-color:#44ff44}.btn{border:none;padding:12px 24px;border-radius:25px;color:#fff;font-weight:bold;margin:5px}.hint{background:linear-gradient(90deg,#ff6a00,#ff006a)}.reset{background:linear-gradient(90deg,#ff6a00,#ff2a00)}.ad{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:99}.adBox{background:#111;border:2px solid #ffcc00;border-radius:20px;padding:20px;max-width:300px}</style></head><body><h1>4 ELEMENTS OF EARTH</h1><div class="sub">VAAL TO WORLD 🌍 MADE IN VAAL</div><div>Stage:<span id="stage">1</span>/1000 Time:<span id="time">30</span>s Games:<span id="games">0</span></div><div style="background:#222;border-radius:20px;padding:8px 16px;display:inline-block;margin:5px">Match: 3 SAME! | <span id="score">S1</span></div><div class="grid" id="grid"></div><button class="btn hint" onclick="showHint()">Hint</button><button class="btn reset" onclick="init()">Reset</button><div class="ad" id="adModal"><div class="adBox"><h2 style="color:#ffcc00">🔥 VAAL AD 🌍</h2><p>Thanks for 2 games!</p><div style="background:#222;padding:30px;margin:10px 0;border-radius:10px">[AdMob]</div><p style="color:#44ff44">You earn R5!</p><button class="btn reset" style="width:100%" onclick="closeAd()">Continue ❌</button></div></div><script>let e=['🔥','💧','🌍','💨'],c=['fire','water','earth','air'],s=[],a=[],t,l=30,g=1,o=0,m=0;function init(){clearInterval(t);l=30;m=0;s=[];document.getElementById('stage').textContent=g;document.getElementById('games').textContent=o;build();start()}function build(){const d=document.getElementById('grid');d.innerHTML='';a=[];let p=[];for(let i=0;i<4;i++)for(let j=0;j<4;j++)p.push(j%4);p.sort(()=>Math.random()-0.5);p.forEach(t=>{let n=document.createElement('div');n.className='cell '+c[t];n.textContent=e[t];n.dataset.type=t;n.onclick=()=>sel(n);d.appendChild(n);a.push(n)})}function sel(d){if(d.classList.contains('matched'))return;if(s.includes(d)){d.classList.remove('selected');s=s.filter(x=>x!==d);return}if(s.length>=3)return;s.push(d);d.classList.add('selected');if(s.length===3)chk()}function chk(){let t0=s[0].dataset.type,ok=s.every(d=>d.dataset.type===t0);if(ok){setTimeout(()=>{s.forEach(d=>{d.classList.remove('selected');d.classList.add('matched')});m+=3;s=[];if(m>=16){g=Math.min(1000,g+1);o++;localStorage.setItem('vaalStage',g);localStorage.setItem('vaalGames',o);if(o%2===0)document.getElementById('adModal').style.display='flex';else init()}},300)}else{setTimeout(()=>{s.forEach(d=>d.classList.remove('selected'));s=[]},500)}}function start(){document.getElementById('time').textContent=l;t=setInterval(()=>{l--;document.getElementById('time').textContent=l;if(l<=0){clearInterval(t);o++;localStorage.setItem('vaalGames',o);if(o%2===0)document.getElementById('adModal').style.display='flex';else{alert('Time up!');init()}}},1000)}function closeAd(){document.getElementById('adModal').style.display='none';init()}function showHint(){let u=a.filter(c=>!c.classList.contains('matched'));for(let t=0;t<4;t++){let q=u.filter(c=>c.dataset.type==t);if(q.length>=3){q.slice(0,3).forEach(c=>{c.style.boxShadow='0 0 15px #00ff88';setTimeout(()=>c.style.boxShadow='',1000)});return}}alert('Reset!')}g=parseInt(localStorage.getItem('vaalStage')||'1');o=parseInt(localStorage.getItem('vaalGames')||'0');init();</script></body></html>
